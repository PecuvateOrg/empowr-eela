<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a70c2">
<title>Offline · Empowr Sessions</title>
<style>
  :root { --bg:#ffffff; --ink:#1a1a1a; --muted:#666; --accent:#4a70c2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --ink:#f2f2f2; --muted:#aaa; } }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif;
         padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); text-align:center; }
  h1 { font-size:1.25rem; margin:0 0 .5rem; }
  p { color:var(--muted); margin:0 0 1.5rem; }
  button { min-height:44px; padding:0 20px; border:0; border-radius:8px; background:var(--accent);
           color:#fff; font:600 1rem system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Empowr Sessions couldn't be reached. Check your connection, then try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
